name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Dependencies float within their ranges, so a new upstream release can break
  # the package while the repo is quiet. GitHub runs scheduled workflows on the
  # default branch only.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:

  lint:
    name: 🧹 Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff check
        run: |
          ruff check .

  test:
    name: 🧪 Test with pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Ensures linting passes before running tests

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Only the declared dependencies plus the test tools, so test_imports.py
      # catches a module that needs a package only an optional extra provides.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      # The suite builds synthetic data: no network, no species grids, no examples/.
      - name: Run pytest
        run: |
          pytest

  e2e:
    name: 🔭 End-to-end on 51 Eri b
    runs-on: ubuntu-latest
    # Only spend the minutes once the cheap checks pass.
    needs: [lint, test]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      # Real IRDIS data from examples/test_data; a few minutes on the runner's 4 CPUs.
      - name: Run the end-to-end test
        run: |
          pytest -m e2e
